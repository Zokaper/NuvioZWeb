# The debug build counter for the `debug-v*` prerelease line.
#
# Its own file, and it must stay that way. `package.json`'s `version` is the *release* version and
# `scripts/appMetadata.mjs` syncs it into `appinfo.json`; a debug build cut between two releases
# must not touch it, or the next release reads as already bumped. Mobile keeps this separation for
# the same reason, in `iosApp/Configuration/DebugVersion.xcconfig`.
#
# Bump this in the same commit as the work being tested, then dispatch the "Debug release"
# workflow. The resulting tag is `debug-v<package.json version>.<DEBUG_BUILD>` and it is published
# as a GitHub **prerelease**, which `js/core/update/appUpdateService.js` ignores - it reads
# `/releases/latest` and rejects `draft` and `prerelease`, so the debug line and the release line
# cannot see each other.
DEBUG_BUILD=1
